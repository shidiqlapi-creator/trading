<script>
/* CORE LOGIC */
const INSTR={};
(function(){
  const add=(s,pip,contract,base,quote,dec)=>{INSTR[s]={pip,contract,base,quote,dec}};
  add('XAUUSD',0.1,100,'XAU','USD',2);
  ['EURUSD','GBPUSD','AUDUSD','NZDUSD'].forEach(s=>add(s,0.0001,100000,s.slice(0,3),'USD',5));
  add('USDJPY',0.01,100000,'USD','JPY',3);
  add('USDCHF',0.0001,100000,'USD','CHF',5);
  add('USDCAD',0.0001,100000,'USD','CAD',5);
  add('EURGBP',0.0001,100000,'EUR','GBP',5);
  add('EURJPY',0.01,100000,'EUR','JPY',3);
  add('GBPJPY',0.01,100000,'GBP','JPY',3);
  add('AUDJPY',0.01,100000,'AUD','JPY',3);
  add('EURAUD',0.0001,100000,'EUR','AUD',5);
  add('EURCHF',0.0001,100000,'EUR','CHF',5);
  add('GBPCHF',0.0001,100000,'GBP','CHF',5);
})();

const DEFAULT_SETTINGS={balance:10000,riskPct:1,maxDailyLossPct:3,utc:7,fx:{JPY:0.0066,GBP:1.30,AUD:0.66,CHF:1.12,CAD:0.72}};
const isNum=v=>typeof v==='number'&&isFinite(v);
const num=v=>{if(v===''||v==null)return null;const n=Number(v);return isFinite(n)?n:null};

function pipValue(sym,price,fx){
  const I=INSTR[sym];const q=I.contract*I.pip;
  if(I.quote==='USD')return q;
  if(I.base==='USD')return q/price;
  return q*((fx&&fx[I.quote])||1);
}

function calcLot(balance,riskPct,slPips,pv){
  if(!(slPips>0&&pv>0))return 0;
  return Math.floor((balance*riskPct/100)/(slPips*pv)*100+1e-9)/100;
}

function calcTrade(t,s){
  const I=INSTR[t.pair];if(!I||!isNum(t.entry)||!isNum(t.sl)||!isNum(t.lot))return null;
  const pv=pipValue(t.pair,t.entry,s.fx);const dir=t.type==='Buy'?1:-1;
  const slPips=Math.abs(t.entry-t.sl)/I.pip;
  const tpPips=isNum(t.tp)?Math.abs(t.tp-t.entry)/I.pip:null;
  const closed=isNum(t.exit);
  const pips=closed?dir*(t.exit-t.entry)/I.pip:null;
  const gross=closed?pips*pv*t.lot:null;
  const net=closed?gross-(t.commission||0)+(t.swap||0):null;
  const risk=slPips*pv*t.lot;
  return{pv,slPips,tpPips,closed,pips,gross,net,risk,
    riskPct:s.balance>0?risk/s.balance*100:null,
    plannedRR:tpPips!=null&&slPips>0?tpPips/slPips:null,
    actualRR:closed&&slPips>0?pips/slPips:null,
    r:closed&&risk>0?net/risk:null}
}

function validateTrade(t,s){
  const errs=[],warns=[];const I=INSTR[t.pair];
  if(!t.dt)errs.push('Isi tanggal dan jam.');
  if(!I)errs.push('Pilih pair.');
  if(!(t.entry>0))errs.push('Entry harus lebih dari 0.');
  if(!(t.sl>0))errs.push('Stop loss wajib diisi.');
  if(!(t.lot>0))errs.push('Lot harus lebih dari 0.');
  if(t.entry>0&&t.sl>0){
    if(t.type==='Buy'&&t.sl>=t.entry)errs.push('Untuk Buy, SL harus di bawah entry.');
    if(t.type==='Sell'&&t.sl<=t.entry)errs.push('Untuk Sell, SL harus di atas entry.')}
  if(t.entry>0&&isNum(t.tp)){
    if(t.type==='Buy'&&t.tp<=t.entry)errs.push('Untuk Buy, TP harus di atas entry.');
    if(t.type==='Sell'&&t.tp>=t.entry)errs.push('Untuk Sell, TP harus di bawah entry.')}
  if(isNum(t.exit)&&!(t.exit>0))errs.push('Exit harus lebih dari 0.');
  if(!errs.length){const c=calcTrade(t,s);
    if(c&&c.riskPct>s.riskPct*1.1)warns.push('Risiko '+c.riskPct.toFixed(2)+'% dari modal melebihi aturan '+s.riskPct+'% per trade.')}
  return{errs,warns};
}

function metrics(list,startBal){
  const n=list.length;const wins=list.filter(x=>x.net>0);const losses=list.filter(x=>x.net<0);
  const gw=wins.reduce((a,x)=>a+x.net,0);const gl=-losses.reduce((a,x)=>a+x.net,0);
  const net=list.reduce((a,x)=>a+x.net,0);const rs=list.filter(x=>isNum(x.r));
  let eq=startBal,peak=startBal,dd=0;
  list.forEach(x=>{eq+=x.net;if(eq>peak)peak=eq;if(peak>0){const d=(peak-eq)/peak;if(d>dd)dd=d}});
  return{n,wins:wins.length,losses:losses.length,winRate:n?wins.length/n*100:null,gw,gl,
    pf:gl>0?gw/gl:(gw>0?Infinity:null),net,expectancy:n?net/n:null,
    avgR:rs.length?rs.reduce((a,x)=>a+x.r,0)/rs.length:null,
    avgWin:wins.length?gw/wins.length:null,avgLoss:losses.length?-gl/losses.length:null,maxDD:dd*100,endEq:eq}
}

function equitySeries(list,startBal){let eq=startBal;const out=[{i:0,dt:null,eq,net:0}];
  list.forEach((x,k)=>{eq+=x.net;out.push({i:k+1,dt:x.dt,eq,net:x.net})});return out}
function sessionOf(dt,utc){const h=parseInt(dt.slice(11,13),10);if(isNaN(h))return'—';const u=((h-utc)%24+24)%24;
  return u<7?'Asian':u<12?'London':u<21?'New York':'Off-hours'}
function weekStart(ds){const d=new Date(ds.slice(0,10)+'T00:00:00Z');const dow=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-dow);return d.toISOString().slice(0,10)}
function addDays(ds,n){const d=new Date(ds.slice(0,10)+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

function btCompute(bt,s){
  const tr=[...bt.trades].sort((a,b)=>(a.dt||'').localeCompare(b.dt||''));let eq=bt.capital;const rows=[];
  tr.forEach(t=>{const I=INSTR[t.pair];if(!I||!(t.entry>0)||!(t.sl>0))return;
    const pv=pipValue(t.pair,t.entry,s.fx);const slPips=Math.abs(t.entry-t.sl)/I.pip;
    const lot=Math.max(0.01,calcLot(eq,bt.risk,slPips,pv));
    const c=calcTrade({...t,lot,commission:0,swap:0},s);if(!c)return;
    const net=c.net;eq+=(net||0);rows.push({...t,lot,c,net,r:c.r,eq})});
  return rows}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genSample(today,s){
  const rnd=mulberry(20261110);const maps=[],trades=[];
  const base={XAUUSD:4180,EURUSD:1.16,GBPUSD:1.32,USDJPY:152};
  const setups=['Order Block','Supply/Demand','Liquidity Sweep','Trend Pullback','Breakout'];
  const causes=['News Impact','Liquidity Sweep / Fakeout','Wrong Structure','Early Entry / Bad Timing'];
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const start=addDays(weekStart(today),-35);let id=0;
  for(let d=0;d<=35+((new Date(today+'T00:00:00Z').getUTCDay()+6)%7);d++){
    const day=addDays(start,d);const dow=(new Date(day+'T00:00:00Z').getUTCDay()+6)%7;
    if(dow>4||day>today)continue;
    const pair=rnd()<.7?'XAUUSD':pick(['EURUSD','GBPUSD','USDJPY']);
    const bias=pick(['Bullish','Bearish','Bullish','Bearish','Sideways']);
    const hit=rnd()<.62;const past=day<today;
    const m={id:'m_s'+(++id),kind:'map',sample:true,date:day,session:pick(['London','New York','London']),pair,bias,
      levels:'Supply '+(base[pair]*(1.004)).toFixed(INSTR[pair].dec-(pair==='XAUUSD'?0:0))+'\nDemand '+(base[pair]*0.996).toFixed(INSTR[pair].dec),
      before:'',after:'',status:!past?'Menunggu':hit?'HIT':'MISS',cause:(!past||hit)?'':pick(causes),notes:''};
    maps.push(m);
    if(past&&bias!=='Sideways'&&rnd()<.75){
      const type=bias==='Bullish'?'Buy':'Sell';const dir=type==='Buy'?1:-1;const I=INSTR[pair];
      const slPips=pair==='XAUUSD'?30+Math.floor(rnd()*30):pair==='USDJPY'?18+Math.floor(rnd()*14):10+Math.floor(rnd()*10);
      const rr=1.5+Math.floor(rnd()*3)*.5;const entry=+(base[pair]*(1+(rnd()-.5)*.004)).toFixed(I.dec);
      const sl=+(entry-dir*slPips*I.pip).toFixed(I.dec);const tp=+(entry+dir*slPips*rr*I.pip).toFixed(I.dec);
      const win=rnd()<(hit?.64:.34);const mode=rnd();
      const exit=win?tp:(mode<.8?sl:+(entry-dir*slPips*I.pip*.3).toFixed(I.dec));
      const pv=pipValue(pair,entry,s.fx);const lot=Math.max(0.01,calcLot(s.balance,s.riskPct*(rnd()<.1?1.8:1),slPips,pv));
      const hr=m.session==='London'?14+Math.floor(rnd()*4):19+Math.floor(rnd()*3);
      const tag=win?pick(['Sesuai rencana','Sesuai rencana','Sabar']):pick(['FOMO','Revenge','Sesuai rencana','FOMO']);
      trades.push({id:'t_s'+id,kind:'trade',sample:true,dt:day+'T'+String(hr).padStart(2,'0')+':'+pick(['05','20','45']),pair,type,entry,exit,sl,tp,lot,
        spread:pair==='XAUUSD'?2.5:0.8,commission:+(lot*7).toFixed(2),swap:0,setup:pick(setups),tag,discipline:win?4+Math.floor(rnd()*2):1+Math.floor(rnd()*3),notes:''})}}
  return{maps,trades}}

/* APP STORAGE & FIREBASE ENGINE */
const docs=new Map();let mode='local',sampleDismissed=false;
const LS='meja-trader-v1';

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify({docs:[...docs.values()],sampleDismissed}))}catch(e){}}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){docs.clear();j.docs.forEach(d=>docs.set(d.id,d));sampleDismissed=!!j.sampleDismissed}}catch(e){}}

async function saveDoc(d){
  docs.set(d.id,d);
  if(mode==='db' && window.fbSetDoc){
    try{
      await window.fbSetDoc(window.fbDocFunc(window.fbDb, "users", "default_trader", "journals", d.id), d);
    }catch(e){
      console.error("Firebase sync error:", e);
    }
  } else {
    persistLocal();
  }
  onData();
}

async function removeDoc(id){
  docs.delete(id);
  if(mode==='db' && window.fbDeleteDoc){
    try{
      await window.fbDeleteDoc(window.fbDocFunc(window.fbDb, "users", "default_trader", "journals", id));
    }catch(e){
      console.error("Firebase delete error:", e);
    }
  } else {
    persistLocal();
  }
  onData();
}

function isBlank(){return[...docs.values()].filter(d=>d.kind!=='settings'&&d.kind!=='flag').length===0}
let S=null;
function build(){
  const all=[...docs.values()];const st=all.find(d=>d.id==='settings')||{};
  const settings={...DEFAULT_SETTINGS,...st,fx:{...DEFAULT_SETTINGS.fx,...(st.fx||{})}};
  const real={maps:all.filter(d=>d.kind==='map'),trades:all.filter(d=>d.kind==='trade'),bts:all.filter(d=>d.kind==='bt'),revs:all.filter(d=>d.kind==='rev')};
  const flag=all.find(d=>d.id==='flag');if(flag&&flag.sampleDismissed)sampleDismissed=true;
  const sample=isBlank()&&!sampleDismissed;let maps=real.maps,trades=real.trades;
  if(sample){const g=genSample(todayStr(),settings);maps=g.maps;trades=g.trades}
  maps=[...maps].sort((a,b)=>b.date.localeCompare(a.date));trades=[...trades].sort((a,b)=>a.dt.localeCompare(b.dt));
  S={settings,maps,trades,bts:real.bts,revs:real.revs,sample}}

function updateChip(){$('#storeChip').textContent=S&&S.sample?'data contoh':mode==='db'?'Firebase Cloud':'Tersimpan di Browser'}
function onData(){build();updateChip();renderBanner();(VIEWS[cur]||{}).refresh?.()}

/* DERIVED UTILS */
function closedTrades(list,s){return list.map(t=>({t,c:calcTrade(t,s)})).filter(x=>x.c&&x.c.closed).map(x=>({...x.t,c:x.c,net:x.c.net,r:x.c.r}))}
function inPeriod(dateStr,p){if(p==='all')return true;const from=addDays(todayStr(),-(p==='7'?7:30));return dateStr.slice(0,10)>=from}
function ymd(x){return(x.dt||x.date||'').slice(0,10)}

/* CHARTS */
function niceRange(min,max){if(min===max){min-=1;max+=1}const span=max-min;const raw=span/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*p).find(x=>x>=raw);const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const ticks=[];for(let v=lo;v<=hi+1e-9;v+=step)ticks.push(+v.toFixed(8));return{lo,hi,ticks}}
const CH={};
function equityChart(id,series,startBal){
  CH[id]=series;if(series.length<2)return'<div class="empty">Belum ada trade tertutup pada periode ini.</div>';
  const W=720,H=250,L=58,R=18,T=12,B=26;const ys=series.map(p=>p.eq).concat([startBal]);
  const nr=niceRange(Math.min(...ys),Math.max(...ys));const X=i=>L+(W-L-R)*i/(series.length-1);const Y=v=>T+(H-T-B)*(1-(v-nr.lo)/(nr.hi-nr.lo));
  const pts=series.map((p,i)=>X(i).toFixed(1)+','+Y(p.eq).toFixed(1));const last=series[series.length-1];
  const grid=nr.ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${Math.round(v).toLocaleString('en-US')}</text>`).join('');
  const d0=series[1].dt?series[1].dt.slice(5,10):'',d1=last.dt?last.dt.slice(5,10):'';
  return`<div class="chartbox"><svg class="ch eq" data-id="${id}" viewBox="0 0 ${W} ${H}" role="img">
    ${grid}<line x1="${L}" x2="${W-R}" y1="${Y(startBal)}" y2="${Y(startBal)}" stroke="var(--axis)" stroke-dasharray="3 4"/>
    <polygon points="${L},${Y(nr.lo)} ${pts.join(' ')} ${X(series.length-1)},${Y(nr.lo)}" fill="var(--s1)" fill-opacity=".10"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${L}" y="${H-6}">${esc(d0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${esc(d1)}</text>
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--axis)" visibility="hidden"/>
    <circle class="dot" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <circle cx="${X(series.length-1)}" cy="${Y(last.eq)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
    </svg><div class="tip" hidden></div></div>`}

document.addEventListener('pointermove',e=>{
  const svg=e.target.closest&&e.target.closest('svg.eq');document.querySelectorAll('svg.eq').forEach(s=>{if(s!==svg){s.querySelector('.xh').setAttribute('visibility','hidden');s.querySelector('.dot').setAttribute('visibility','hidden');s.parentNode.querySelector('.tip').hidden=true}});
  if(!svg)return;const ser=CH[svg.dataset.id];if(!ser)return;const vb=svg.viewBox.baseVal;const r=svg.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*vb.width;const L=58,R=18;let i=Math.round((x-L)/(vb.width-L-R)*(ser.length-1));i=Math.max(0,Math.min(ser.length-1,i));
  const p=ser[i];const nx=L+(vb.width-L-R)*i/(ser.length-1);
  const ys=ser.map(q=>q.eq);const nr=niceRange(Math.min(...ys,ser[0].eq),Math.max(...ys,ser[0].eq));const T=12,B=26;const ny=T+(vb.height-T-B)*(1-(p.eq-nr.lo)/(nr.hi-nr.lo));
  const xh=svg.querySelector('.xh'),dot=svg.querySelector('.dot');xh.setAttribute('x1',nx);xh.setAttribute('x2',nx);xh.setAttribute('visibility','visible');
  dot.setAttribute('cx',nx);dot.setAttribute('cy',ny);dot.setAttribute('visibility','visible');
  const tip=svg.parentNode.querySelector('.tip');tip.hidden=false;tip.style.left=(nx/vb.width*r.width)+'px';tip.style.top=(ny/vb.height*r.height)+'px';
  tip.textContent=(p.i===0?'Modal awal':'Trade '+p.i+(p.dt?' · '+p.dt.slice(5,10):''))+' · $'+f2(p.eq)+(p.i?' ('+money(p.net)+')':'')});

function sessionBars(items){
  const W=420,H=210,L=52,R=10,T=22,B=40;const vals=items.map(i=>i.net);const nr=niceRange(Math.min(0,...vals),Math.max(0,...vals));
  const Y=v=>T+(H-T-B)*(1-(v-nr.lo)/(nr.hi-nr.lo));const bw=Math.min(64,(W-L-R)/items.length*.55);const colors=['var(--s3)','var(--s1)','var(--s2)'];
  const grid=nr.ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${Math.round(v).toLocaleString('en-US')}</text>`).join('');
  const bars=items.map((it,k)=>{const cx=L+(W-L-R)*(k+.5)/items.length;const y0=Y(0),y1=Y(it.net);const top=Math.min(y0,y1),h=Math.max(2,Math.abs(y1-y0));
    const lab=it.n?money(it.net,0):'—';const ly=it.net>=0?top-6:top+h+13;
    return`<g><title>${esc(it.name)}: ${it.n} trade, net ${money(it.net)}</title>
    ${it.n?`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${colors[k%3]}"/>`:''}
    <text x="${cx}" y="${ly}" text-anchor="middle" style="fill:var(--ink)">${lab}</text>
    <text x="${cx}" y="${H-20}" text-anchor="middle">${esc(it.name)}</text><text x="${cx}" y="${H-7}" text-anchor="middle">${it.n} trade</text></g>`}).join('');
  return`<svg class="ch" viewBox="0 0 ${W} ${H}">${grid}<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>${bars}</svg>`}

function hbars(items,unit){
  if(!items.some(i=>i.v>0))return'<div class="empty">Belum ada data.</div>';const mx=Math.max(...items.map(i=>i.v));
  return`<div style="display:grid;gap:10px">${items.map(i=>`<div><div class="row" style="justify-content:space-between;font-size:13px"><span>${esc(i.name)}</span><span class="num">${i.v}${unit||''}</span></div><div class="bar"><i style="width:${mx?i.v/mx*100:0}%"></i></div></div>`).join('')}</div>`}

/* INIT FIREBASE & SYSTEM BOOT */
window.addEventListener('firebase-ready', () => {
  if(window.fbDb && window.fbCol) {
    mode = 'db';
    window.fbOnSnapshot(window.fbCol, (snapshot) => {
      docs.clear();
      snapshot.forEach((docSnap) => {
        docs.set(docSnap.id, docSnap.data());
      });
      build();
      updateChip();
      (VIEWS[cur]||{}).refresh?.();
    }, (error) => {
      console.warn("Firestore error, falling back to local:", error);
      mode = 'local';
      loadLocal();
      build();
      updateChip();
    });
  } else {
    mode = 'local';
    loadLocal();
    build();
    updateChip();
  }
});

// Service Worker Registration for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registered successfully! Scope:', reg.scope))
      .catch(err => console.warn('Service Worker registration failed:', err));
  });
}

// Initial Local Load fallback before Firebase connects
loadLocal();
build();
route();
</script>
